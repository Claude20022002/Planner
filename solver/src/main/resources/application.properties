# Service interne : jamais exposé publiquement (seul Planner l'appelle)
server.port=${PORT:8080}
spring.application.name=hestim-solver

# Deux calculs en parallèle au plus (au-delà : 429), pour borner CPU et mémoire.
# Lu aussi par ConfigurationSolveur ; la durée par défaut d'un calcul (60 s) y est fixée.
solver.calculs-simultanes-max=2

# Sécurité : jeton partagé avec Planner (32 caractères au moins), corps de requête borné
solver.jeton=${SOLVER_TOKEN:}
solver.taille-max-octets=5242880
server.tomcat.max-swallow-size=5MB
server.error.include-stacktrace=never
server.error.include-message=never

# Planner envoie seulement les champs utiles ; les autres sont ignorés
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
# Jackson 3 (Spring Boot 4) refuse par défaut un null dans un nombre entier ; Jackson 2 le lisait 0
spring.jackson.deserialization.fail-on-null-for-primitives=false
