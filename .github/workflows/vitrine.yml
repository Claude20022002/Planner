name: Site vitrine

# Construit le site vitrine (VIT-01) à chaque pull request et à chaque push sur main qui le touche.
# Ne publie rien : le site construit est seulement gardé en artefact de CI pour être prévisualisé
# (décision du chef : rien n'est mis en ligne tant que la vente est gelée).
on:
  push:
    branches: [main]
    paths: ["vitrine/**", "scripts/verifier-neutre.mjs", ".github/workflows/vitrine.yml"]
  pull_request:
    branches: [main]
    paths: ["vitrine/**", "scripts/verifier-neutre.mjs", ".github/workflows/vitrine.yml"]

concurrency:
  group: vitrine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Astro n'envoie aucune donnée d'usage depuis la CI
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  construire:
    name: Construire le site vitrine
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vitrine

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: vitrine/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Ce qui part dans le navigateur (Motion, Lucide, Inter) : une vulnérabilité haute bloque.
      # Astro et React ne servent qu'à la construction (devDependencies).
      - name: Audit des dépendances livrées
        run: npm audit --omit=dev --audit-level=high

      - name: Aucun nom d'école écrit en dur
        run: node ../scripts/verifier-neutre.mjs

      - name: Tests unitaires (traductions, contrastes)
        run: npm run test:unit

      - name: Construction
        run: npm run build

      - name: Site construit, en artefact (non publié)
        uses: actions/upload-artifact@v4
        with:
          name: site-vitrine
          path: vitrine/dist/
          retention-days: 7
