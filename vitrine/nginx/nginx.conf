# Sert le site Astro derrière Traefik, sur un port HTTP interne.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    include /etc/nginx/csp.conf;

    # Traefik indique le protocole extérieur. HSTS reste propre à cet hôte.
    map $http_x_forwarded_proto $hsts_vitrine {
        default "";
        https "max-age=31536000";
    }

    map $uri $cache_vitrine {
        default "public, no-cache";
        "~^/_astro/[^/]+\.[A-Za-z0-9_-]{8,}\.[a-zA-Z0-9]+$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /srv/vitrine;
        absolute_redirect off;

        add_header Strict-Transport-Security $hsts_vitrine always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $politique_vitrine always;
        add_header X-Robots-Tag noindex always;
        add_header Cache-Control $cache_vitrine;
        etag on;

        location ~ /$ {
            try_files ${uri}index.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
