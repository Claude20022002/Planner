# ────────────────────────────────────────────────────────────────────────────
#  Surcharge pour le serveur Debian partagé avec n8n (EXP-02a).
#
#  Traefik de n8n tient déjà les ports 80 et 443. Ici :
#   - aucune construction : les images arrivent toutes faites (docker save | docker load) ;
#   - Caddy n'a aucun port publié sur l'hôte ; Traefik l'atteint sur le réseau n8n_default ;
#   - les noms publics viennent de .env.docker (SITE_ADDRESS, FICHIERS_ADDRESS, QUIZ_ADDRESS) ;
#   - chaque conteneur a une limite de mémoire : en cas de manque, ce sont eux qui sont
#     arrêtés, jamais l'application voisine ;
#   - aucun port de base de données ou d'API publié sur l'hôte ;
#   - journaux bornés (REL-06) : json-file, 10 Mo, 5 fichiers, sur chaque service.
#
#  Ne jamais lancer docker-compose.yml seul : il publie 80 et 443.
#  Ne jamais lancer, dans le dossier de n8n, docker compose --profile cpu up
#  (ce profil ramènerait Ollama). Ne pas modifier le compose de n8n.
#
#  EXP-02a s'arrête au contrôle, qui ne démarre rien :
#    docker compose --env-file .env.docker -f docker-compose.yml -f deploy/vps/docker-compose.vps.yml config
#  Le up, toujours avec cette surcharge, est EXP-02b.
# ────────────────────────────────────────────────────────────────────────────

x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    logging: *journaux
    ports: !reset []
    volumes:
      - ./deploy/vps/mysql.cnf:/etc/mysql/conf.d/hestim.cnf:ro
    mem_limit: 512m

  backend:
    logging: *journaux
    build: !reset null
    ports: !reset []
    environment:
      # Traefik de n8n, Caddy, puis nginx du frontend : trois proxys devant l'API
      TRUST_PROXY_HOPS: 3
    mem_limit: 384m

  solver:
    logging: *journaux
    image: claude20022002/hestim-solver:latest
    build: !reset null
    environment:
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 640m

  frontend:
    logging: *journaux
    build: !reset null
    mem_limit: 64m

  caddy:
    logging: *journaux
    # Aucun port sur l'hôte : 80 et 443 restent à Traefik. Seul Caddy rejoint n8n_default.
    ports: !reset []
    volumes:
      - ./deploy/vps/Caddyfile.vps:/etc/caddy/Caddyfile:ro
    mem_limit: 128m
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - "traefik.http.routers.planner.rule=Host(`${SITE_ADDRESS:?SITE_ADDRESS requis dans .env.docker}`)"
      - traefik.http.routers.planner.entrypoints=websecure
      - traefik.http.routers.planner.tls.certresolver=mytlschallenge
      - traefik.http.routers.planner.service=caddy
      - "traefik.http.routers.fichiers.rule=Host(`${FICHIERS_ADDRESS:?FICHIERS_ADDRESS requis dans .env.docker}`)"
      - traefik.http.routers.fichiers.entrypoints=websecure
      - traefik.http.routers.fichiers.tls.certresolver=mytlschallenge
      - traefik.http.routers.fichiers.service=caddy
      - "traefik.http.routers.quiz.rule=Host(`${QUIZ_ADDRESS:?QUIZ_ADDRESS requis dans .env.docker}`)"
      - traefik.http.routers.quiz.entrypoints=websecure
      - traefik.http.routers.quiz.tls.certresolver=mytlschallenge
      - traefik.http.routers.quiz.service=caddy
      - traefik.http.services.caddy.loadbalancer.server.port=80

  studylib:
    logging: *journaux
    build: !reset null
    mem_limit: 256m

  studylib-queue:
    logging: *journaux
    mem_limit: 160m

  studylib-scheduler:
    logging: *journaux
    mem_limit: 128m

  redis:
    logging: *journaux
    mem_limit: 96m

  minio:
    logging: *journaux
    mem_limit: 256m

  # Crée le compartiment des documents au premier démarrage (idempotent), puis s'arrête
  minio-init:
    logging: *journaux
    # Même image que le serveur MinIO : elle contient le client mc
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: hestim_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set hestim http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 2; done;
        mc mb --ignore-existing hestim/studylib && echo "compartiment studylib prêt"
    restart: "no"
    mem_limit: 64m
    networks:
      - hestim_net

  meilisearch:
    logging: *journaux
    environment:
      MEILI_MAX_INDEXING_MEMORY: 100Mb
    mem_limit: 256m

  quiz-api:
    logging: *journaux
    build: !reset null
    mem_limit: 320m

  quiz-worker:
    logging: *journaux
    mem_limit: 256m

  quiz-frontend:
    logging: *journaux
    build: !reset null
    mem_limit: 256m

  quiz-db:
    logging: *journaux
    mem_limit: 192m

  quiz-meilisearch:
    logging: *journaux
    mem_limit: 192m

# Réseau déjà créé par n8n. On ne le crée pas et on ne le modifie pas.
networks:
  n8n_default:
    external: true
    name: n8n_default
