# Banc PLA-06 isolé ; seul le chef utilise lancer.sh (plan § 4 validé).
name: planner-mesure-pla06
services:
  mysql:
    image: mysql:8.4.13
    labels:
      traefik.enable: "false"
    environment:
      MYSQL_ROOT_PASSWORD: ${MESURE_MYSQL_ROOT:?initialiser avec lancer.sh}
      MESURE_REGLAGE: ${MESURE_REGLAGE:-production}
      MESURE_INNODB_POOL: ${MESURE_INNODB_POOL:-1G}
    entrypoint:
      - sh
      - -c
      - cp /reglages/$${MESURE_REGLAGE}.cnf /etc/mysql/conf.d/mesure.cnf && chmod 644 /etc/mysql/conf.d/mesure.cnf && exec docker-entrypoint.sh mysqld --innodb-buffer-pool-size=$${MESURE_INNODB_POOL}
    volumes:
      - planner_mesure_pla06:/var/lib/mysql
      - ./mysql:/reglages:ro
    mem_limit: ${MESURE_MYSQL_MEMOIRE:-2g}
    memswap_limit: ${MESURE_MYSQL_MEMOIRE:-2g}
    cpus: 1
    ulimits:
      nofile:
        soft: 1024
        hard: 524288
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  banc:
    image: node:22-bookworm-slim
    labels:
      traefik.enable: "false"
    working_dir: /banc
    command: ["node", "/banc/serveur-banc.mjs"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      NODE_ENV: production
      ICU_TIMEZONE_FILES_DIR: /app/tzdata
      MESURE_MODE: ${MESURE_MODE:-a}
      MESURE_ECOLES: ${MESURE_ECOLES:-200}
      MESURE_TACHES: ${MESURE_TACHES:-oui}
    volumes:
      - ../../../backend:/app:ro
      - dependances:/app/node_modules:ro
      - ../../../shared:/shared:ro
      - ../../../deploy:/deploy:ro
      - .:/banc
    ports:
      - "127.0.0.1:5099:5099"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    depends_on:
      mysql:
        condition: service_healthy
  # Toujours seul, banc arrêté ; npm écrit dans le volume dédié.
  installer:
    image: node:22-bookworm-slim
    labels:
      traefik.enable: "false"
    profiles: ["installer"]
    working_dir: /app
    command: ["npm", "ci", "--omit=dev", "--no-audit", "--no-fund"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    volumes:
      - ../../../backend:/app:ro
      - dependances:/app/node_modules
volumes:
  planner_mesure_pla06:
  dependances:
